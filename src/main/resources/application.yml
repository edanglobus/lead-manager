spring:
  application:
    name: lead-manager-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadmanager}
    username: ${DB_USERNAME:leadmanager}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. NEVER use update/create.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never     # never leak stack traces (CLAUDE.md security)
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.leadmanager: INFO
