services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadmanager}
      POSTGRES_USER: ${POSTGRES_USER:-leadmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-leadmanager} -d $${POSTGRES_DB:-leadmanager}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
