spring:
  application:
    name: lead-manager-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadmanager}
    username: ${DB_USERNAME:leadmanager}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. NEVER use update/create.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

lead-manager:
  jwt:
    # HS256 requires at least a 256-bit (32-byte) secret. JwtProperties
    # validates this at startup so a too-short secret fails fast with a
    # clear error rather than a cryptic crypto exception on first request.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:lead-manager-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}   # ISO-8601 duration; default 15 min

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never     # never leak stack traces (CLAUDE.md security)
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.leadmanager: INFO
